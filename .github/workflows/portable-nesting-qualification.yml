name: Oct13 existing diagram feedback qualification
on:
  push:
    branches: [validation/diagram-feedback-oct13]
permissions:
  contents: read
jobs:
  full:
    if: github.repository == 'rudycelekli/diagram-design' && github.event.repository.private == false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: '314'
            head: 8c8c7f0fca98e8da02ff24b30f85aa6b86fbe269
          - pr: '421'
            head: 27a7b578bdd5d8525918f1742cc265935600036f
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.head }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install repository-pinned browser dependencies
        run: |
          python -m pip install Pillow==12.1.1 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Bind package version comparison to upstream base
        run: |
          git -C candidate fetch https://github.com/cathrynlavery/diagram-design.git e80b91cc9c1745434cd2239c693df57100bd9bca
          git -C candidate update-ref refs/remotes/origin/main FETCH_HEAD
          test "$(git -C candidate rev-parse origin/main)" = e80b91cc9c1745434cd2239c693df57100bd9bca
      - name: Run every mandatory gate on immutable candidate
        run: python harness/qualification-runner-${{ matrix.pr }}.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: diagram-feedback-${{ matrix.pr }}-full-proof
          path: proof
          retention-days: 1
          compression-level: 9
