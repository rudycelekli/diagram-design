name: Conditional SVG full qualification
on:
  push:
    branches: [qualification/conditional-svg-repair]
permissions:
  contents: read
jobs:
  full:
    if: github.repository == 'rudycelekli/diagram-design' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 514c02ff7234e6b0cf0c7cd26167ffbbd0e3cf6b
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install repository-pinned browser dependencies
        run: |
          python -m pip install Pillow==12.1.1 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Bind package version comparison to upstream base
        run: |
          git -C candidate fetch https://github.com/cathrynlavery/diagram-design.git 4335a99835f568bbc7eb45ff3a38abbf04eaab18
          git -C candidate update-ref refs/remotes/origin/main FETCH_HEAD
          test "$(git -C candidate rev-parse origin/main)" = 4335a99835f568bbc7eb45ff3a38abbf04eaab18
      - name: Run every mandatory gate on immutable candidate
        run: python harness/qualification-runner.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: conditional-svg-full-proof
          path: proof
          retention-days: 1
          compression-level: 9
