name: pr420 full qualification
on:
  push:
    branches: [qualification/css-selector-literals]
permissions:
  contents: read
jobs:
  full:
    if: github.repository == 'rudycelekli/diagram-design' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9cf1a8a5cf081b2a3b872fbf8a79284c8f5e1233
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install repository-pinned browser dependencies
        run: |
          python -m pip install Pillow==12.1.1 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Bind package version comparison to upstream base
        run: |
          git -C candidate fetch https://github.com/cathrynlavery/diagram-design.git ec8a36e8771bb8a0eb35757a2c1003f3e6fb135f
          git -C candidate update-ref refs/remotes/origin/main FETCH_HEAD
          test "$(git -C candidate rev-parse origin/main)" = ec8a36e8771bb8a0eb35757a2c1003f3e6fb135f
      - name: Run every mandatory gate on immutable candidate
        run: python harness/qualification-runner.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: selector-literal-full-proof
          path: proof
          retention-days: 1
          compression-level: 9
