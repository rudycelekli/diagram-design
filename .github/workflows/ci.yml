name: Owned Diagram392 current79 pinned qualification

on:
  push:
    branches: [ "ci/diagram392-current79-20261010" ]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  plugin-package:
    name: Plugin Package & Version Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
        with:
          repository: rudycelekli/diagram-design
          ref: d19078f75e07556763101127ce03536831c0051f
          fetch-depth: 0
          persist-credentials: false

      - name: Guard immutable reviewed source and merge ancestry
        id: source_guard
        env:
          SOURCE_SHA: d19078f75e07556763101127ce03536831c0051f
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "source_sha must be lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "b5feea6e00b0ffad70623ccae3483d5c7cc380a6"
          test "$(git rev-parse HEAD^1)" = "246d6d71d752245403d2bf28d27f124192584d18"
          test "$(git rev-parse HEAD^2)" = "decc53e1078fc7ea5b104a5f54dc0bc0f1de9586"
          echo "Verified immutable source $SOURCE_SHA tree b5feea6e00b0ffad70623ccae3483d5c7cc380a6, current-base 246d6d71d752245403d2bf28d27f124192584d18, prior-author decc53e1078fc7ea5b104a5f54dc0bc0f1de9586"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test plugin package tooling
        run: python3 scripts/test-plugin-package.py

      - name: Verify maintainer policy tracks package and CI truth
        run: python3 scripts/test-maintainer-policy.py

      - name: Verify OpenAI plugin directory listing and upload ZIP
        run: python3 scripts/test-build-openai-plugin-zip.py

      # Versions are bumped on main by the Auto Version Bump workflow after
      # each merge (ADR 0009); pull requests must leave them untouched.
      # A pull_request checkout is GitHub's merge of the PR into the current
      # base tip, so the merge's first parent is the base to compare against.
      # github.event.pull_request.base.sha can predate later auto-bumps and
      # would report their versions as edits made by the PR.
      - name: Forbid manifest version changes in pull requests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
              echo "expected the pull request merge commit at HEAD" >&2
              exit 1
            fi
            python3 scripts/verify-plugin-package.py --require-no-bump HEAD^1
          else
            python3 scripts/verify-plugin-package.py --current-only
          fi

      - name: Validate Claude marketplace package without warnings
        run: npx --yes @anthropic-ai/claude-code@2.1.229 plugin validate . --strict

  python39-compat:
    name: Python 3.9 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: rudycelekli/diagram-design
          ref: d19078f75e07556763101127ce03536831c0051f
          fetch-depth: 0
          persist-credentials: false

      - name: Guard immutable reviewed source and merge ancestry
        id: source_guard
        env:
          SOURCE_SHA: d19078f75e07556763101127ce03536831c0051f
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "source_sha must be lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "b5feea6e00b0ffad70623ccae3483d5c7cc380a6"
          test "$(git rev-parse HEAD^1)" = "246d6d71d752245403d2bf28d27f124192584d18"
          test "$(git rev-parse HEAD^2)" = "decc53e1078fc7ea5b104a5f54dc0bc0f1de9586"
          echo "Verified immutable source $SOURCE_SHA tree b5feea6e00b0ffad70623ccae3483d5c7cc380a6, current-base 246d6d71d752245403d2bf28d27f124192584d18, prior-author decc53e1078fc7ea5b104a5f54dc0bc0f1de9586"

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Verify linter compatibility
        run: |
          python scripts/test-lint-a11y.py
          python scripts/lint-skin.py --all --baseline

  validate:
    name: Lint & Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "core.autocrlf"
          GIT_CONFIG_VALUE_0: "false"
        with:
          repository: rudycelekli/diagram-design
          ref: d19078f75e07556763101127ce03536831c0051f
          fetch-depth: 0
          persist-credentials: false

      - name: Guard immutable reviewed source and merge ancestry
        id: source_guard
        env:
          SOURCE_SHA: d19078f75e07556763101127ce03536831c0051f
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "source_sha must be lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "b5feea6e00b0ffad70623ccae3483d5c7cc380a6"
          test "$(git rev-parse HEAD^1)" = "246d6d71d752245403d2bf28d27f124192584d18"
          test "$(git rev-parse HEAD^2)" = "decc53e1078fc7ea5b104a5f54dc0bc0f1de9586"
          echo "Verified immutable source $SOURCE_SHA tree b5feea6e00b0ffad70623ccae3483d5c7cc380a6, current-base 246d6d71d752245403d2bf28d27f124192584d18, prior-author decc53e1078fc7ea5b104a5f54dc0bc0f1de9586"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify accessible SVG contract
        if: always() && steps.source_guard.outcome == 'success'
        id: a11y
        run: python scripts/test-lint-a11y.py

      - name: Verify semantic pattern documentation
