        id: ridgeline
        run: python scripts/verify-ridgeline.py --all

      - name: Verify ridgeline checker
        if: always() && steps.source_guard.outcome == 'success'
        id: ridgeline_tests
        run: python scripts/test-verify-ridgeline.py

