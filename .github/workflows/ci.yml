        run: python scripts/test-self-check.py

      - name: Verify standalone SVG export (CSS carry + defs IDs)
        if: always() && steps.source_guard.outcome == 'success'
        id: export_svg
        run: python scripts/test-export-svg-standalone.py

      - name: Verify label geometry
        if: always() && steps.source_guard.outcome == 'success'
        id: geometry
        run: python scripts/verify-geometry.py --all

      - name: Verify label geometry checker
        if: always() && steps.source_guard.outcome == 'success'
        id: geometry_tests
        run: python scripts/test-verify-geometry.py

      - name: Verify block registry
        if: always() && steps.source_guard.outcome == 'success'
        id: block_registry
        run: python scripts/verify-block-registry.py --all

      - name: Verify block registry checker
        if: always() && steps.source_guard.outcome == 'success'
        id: block_registry_tests
        run: python scripts/test-verify-block-registry.py

      - name: Verify treemap area fidelity and label fit
        if: always() && steps.source_guard.outcome == 'success'
        id: treemap
        run: python scripts/verify-treemap.py --all

      - name: Verify treemap checker
        if: always() && steps.source_guard.outcome == 'success'
        id: treemap_tests
        run: python scripts/test-verify-treemap.py

      - name: Verify marimekko width, height and area shares
