name: Windows-only Mermaid458 EOL qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
concurrency:
  group: diagram458-windows-eol-correction
  cancel-in-progress: false
jobs:
  validate:
    name: Lint & Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-latest
        python-version:
        - '3.11'
        - '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Preserve canonical source line endings
      shell: bash
      run: 'git config --global core.autocrlf input

        git config --global core.eol lf'
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      env:
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: core.autocrlf
        GIT_CONFIG_VALUE_0: 'false'
      with:
        persist-credentials: false
        repository: cathrynlavery/diagram-design
        ref: f2f4d49ea8d632f17cf196ba26599277a93f767b
    - name: Apply exactreviewed3path repair packet
      shell: bash
      run: 'python - <<''PY''

        from pathlib import Path

        import base64,hashlib,json,subprocess,os

        M={''repository'': ''cathrynlavery/diagram-design'', ''existing_pr'': 458, ''source_head'': ''a38e7b2b185c84e8d70bcb3f77aec5730b1f9765'', ''qualified_base'': ''f2f4d49ea8d632f17cf196ba26599277a93f767b'', ''merge_base'': ''550fd66edff058bc73056c3416b76d69cfe865ba'', ''candidate_patch_sha256'': ''ff6e3bb3fbb994542399a9164863a795b46d6846a85843b601e574316bc8b3c1'', ''paths'': [''scripts/verify-mermaid-import.py'', ''skills/diagram-design/references/import-mermaid.md'', ''skills/diagram-design/scripts/mermaid_extract.py''], ''files'': {''scripts/verify-mermaid-import.py'': {''sha256'': ''26b81f1153023946aa9a5857eb90483891e6c79f22ce80785cf164d20189c86e'', ''mode'': ''100644'', ''bytes'': 69860}, ''skills/diagram-design/references/import-mermaid.md'': {''sha256'': ''f7f3c12c98dd5673cd4446143d995a28b473eff014f58b11050502af639ef567'', ''mode'': ''100644'', ''bytes'': 11719}, ''skills/diagram-design/scripts/mermaid_extract.py'': {''sha256'': ''65482f943f77b4cae4196d02ce9beb312793a4050b5cdaefa1ad4fd9b4c87066'', ''mode'': ''100644'', ''bytes'': 58627}}, ''native_before'': ''BASELINE-REPRODUCTION.json at exactexistingPRhead;2actualCLI parsefailures+3silentlabelcorruptions'', ''native_after'': ''7lightweight actualCLI cases pass onisolatedheadfix; fullcurrentmainmergedqualificationPENDING'', ''conflict_resolution'': ''Retainbothcurrentmainheaderstatement gate andexistingedgeIDgate; preserveothermainchanges'', ''branch_actions'': ''NONE; rootsolepublisher; intendednormalmergechildwithcurrentmain +relatedrepair notnewPR'', ''publications'': 0}

        root=Path(os.environ[''RUNNER_TEMP''])/''diagram458'';root.mkdir(exist_ok=True)

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==M[''qualified_base'']

        assert not subprocess.check_output([''git'',''status'',''--porcelain''],text=True).strip()

        raw=base64.b64decode('''',validate=True)

        assert hashlib.sha256(raw).hexdigest()==M[''candidate_patch_sha256'']

        f=root/''applied.patch'';f.write_bytes(raw)

        paths=[line.split(''\t'',2)[2] for line in subprocess.check_output([''git'',''apply'',''--numstat'',str(f)],text=True).splitlines()]

        assert sorted(paths)==sorted(M[''paths''])

        subprocess.run([''git'',''apply'',''--check'',str(f)],check=True);subprocess.run([''git'',''apply'',str(f)],check=True)

        (root/''metadata.json'').write_text(json.dumps({''source_base'':M[''qualified_base''],''existing_pr'':458,''source_pr_head'':M[''source_head''],''patch_sha256'':M[''candidate_patch_sha256''],''workflow_head'':os.environ[''GITHUB_SHA''],''source_pushed'':False},indent=2))


        PY'
    - name: Exactpreflight patchidentity
      shell: bash
      env:
        IDENTITY_PHASE: preflight
      run: 'python - <<''PY''

        from pathlib import Path

        import json,subprocess,hashlib,os

        M={''repository'': ''cathrynlavery/diagram-design'', ''existing_pr'': 458, ''source_head'': ''a38e7b2b185c84e8d70bcb3f77aec5730b1f9765'', ''qualified_base'': ''f2f4d49ea8d632f17cf196ba26599277a93f767b'', ''merge_base'': ''550fd66edff058bc73056c3416b76d69cfe865ba'', ''candidate_patch_sha256'': ''ff6e3bb3fbb994542399a9164863a795b46d6846a85843b601e574316bc8b3c1'', ''paths'': [''scripts/verify-mermaid-import.py'', ''skills/diagram-design/references/import-mermaid.md'', ''skills/diagram-design/scripts/mermaid_extract.py''], ''files'': {''scripts/verify-mermaid-import.py'': {''sha256'': ''26b81f1153023946aa9a5857eb90483891e6c79f22ce80785cf164d20189c86e'', ''mode'': ''100644'', ''bytes'': 69860}, ''skills/diagram-design/references/import-mermaid.md'': {''sha256'': ''f7f3c12c98dd5673cd4446143d995a28b473eff014f58b11050502af639ef567'', ''mode'': ''100644'', ''bytes'': 11719}, ''skills/diagram-design/scripts/mermaid_extract.py'': {''sha256'': ''65482f943f77b4cae4196d02ce9beb312793a4050b5cdaefa1ad4fd9b4c87066'', ''mode'': ''100644'', ''bytes'': 58627}}, ''native_before'': ''BASELINE-REPRODUCTION.json at exactexistingPRhead;2actualCLI parsefailures+3silentlabelcorruptions'', ''native_after'': ''7lightweight actualCLI cases pass onisolatedheadfix; fullcurrentmainmergedqualificationPENDING'', ''conflict_resolution'': ''Retainbothcurrentmainheaderstatement gate andexistingedgeIDgate; preserveothermainchanges'', ''branch_actions'': ''NONE; rootsolepublisher; intendednormalmergechildwithcurrentmain +relatedrepair notnewPR'', ''publications'': 0}

        root=Path(os.environ[''RUNNER_TEMP''])/''diagram458'';root.mkdir(exist_ok=True)

        phase=os.environ.get(''IDENTITY_PHASE'',''final'')

        raw=subprocess.check_output([''git'',''diff'',''--binary'',''--full-index''])

        (root/(phase+''.patch'')).write_bytes(raw)

        status=subprocess.check_output([''git'',''status'',''--porcelain'',''-uall''],text=True);(root/(phase+''-status.txt'')).write_text(status)

        assert not subprocess.check_output([''git'',''ls-files'',''--others'',''--exclude-standard''],text=True).strip()

        paths=subprocess.check_output([''git'',''diff'',''--name-only''],text=True).splitlines();assert sorted(paths)==sorted(M[''paths''])

        files={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in paths};(root/(phase+''-files.json'')).write_text(json.dumps(files,indent=2))

        assert files=={k:v[''sha256''] for k,v in M[''files''].items()}

        assert hashlib.sha256(raw).hexdigest()==M[''candidate_patch_sha256'']

        subprocess.run([''git'',''diff'',''--check''],check=True)

        (root/(phase+''-identity.json'')).write_text(json.dumps({''patch_sha256'':hashlib.sha256(raw).hexdigest(),''matches_reviewed'':True},indent=2));print(''Exactreviewed''+phase+''patch/sourceidentity PASS'')


        PY'
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
